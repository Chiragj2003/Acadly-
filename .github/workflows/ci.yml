name: Acadly Continuous Integration

on:
  push:
    branches: [main, master, round-1]
  pull_request:
    branches: [main, master, round-1]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: TypeScript & Architecture Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Architecture & Data Integrity Static Check
        run: npm run lint:architecture:static

  test:
    name: Jest Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Test Suite
        run: |
          npm test 2>&1 | tee test-output.log
        env:
          CI: 'true'
          EXPO_PUBLIC_SUPABASE_URL: https://mock-ci-project.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: mock-ci-anon-key-for-test-suite

      - name: Publish Test Summary
        if: always()
        run: |
          echo "## Jest Test Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 test-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  supabase-rls-audit:
    name: Supabase Migration & RLS Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Local Supabase
        run: supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector

      - name: Reset Database and Apply Canonical Migrations
        run: supabase db reset

      - name: Execute RLS & Multi-Tenant Audit Suite
        run: supabase test db
